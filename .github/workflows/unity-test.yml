name: Unity Test Runner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Library 폴더 캐시 (빌드 속도 향상)
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-DragonCrashers-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-DragonCrashers-
            Library-

      # 3. Edit Mode 테스트 실행
      - name: Run EditMode Tests
        uses: game-ci/unity-test-runner@v4
        id: editmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactName: EditMode-Results

      # 4. Play Mode 테스트 실행
      - name: Run PlayMode Tests
        uses: game-ci/unity-test-runner@v4
        id: playmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: playmode
          artifactName: PlayMode-Results

      # 5. 테스트 결과 업로드 (실패해도 항상 업로드)
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results
          path: artifacts/
          retention-days: 14
